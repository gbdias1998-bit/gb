<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio - Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Meu Portfólio</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="contato.html">Contatos</a>
        </nav>
    </header>

    <main>
        <section class="form-card">
            <h2>Entre em contato</h2>
            <p>Preencha o formulário abaixo para enviar sua mensagem</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" required></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Meu Portfólio. Todos os direitos reservados.</p>
        <p>Desenvolvido com HTML5 e CSS3.</p>
        <p><a href="contato.html">Entre em contato</a></p>
    </footer>

</body>
</html>
